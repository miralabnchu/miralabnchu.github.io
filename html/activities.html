      <!-- 每一列一則活動：<dt>2026.09</dt><dd>活動名稱<small>一句說明</small></dd>，新的放最上面 -->
      <dl class="rows">
        <!--
          有照片的活動：在活動名稱下面放一個 <div class="slides" data-slides>，照片放在 ../assets/activities/。
          照片會自動輪播，每 6 秒慢慢淡入換一張（data-interval 是毫秒，可以改）。
          照片左右兩側的箭頭可以手動換上一張、下一張，兩個 <button> 放在最後一張 <img> 後面。
          第一張加 class="is-on"，增減照片只要增減 <img>。
        -->
        <div>
          <dt>2026.09.10</dt>
          <dd>
            <span data-en="Lab dinner">實驗室聚餐</span>
            <div class="slides" data-slides data-interval="6000">
              <div class="slides-frame">
                <img class="is-on" src="../assets/activities/lab-dinner-2026-09-10-1.jpg" alt="實驗室成員在餐廳長桌旁的聚餐合照，第 1 張" data-en-alt="Lab members at a long restaurant table at the lab dinner, photo 1" width="1280" height="960" />
                <img src="../assets/activities/lab-dinner-2026-09-10-2.jpg" alt="實驗室成員在餐廳長桌旁的聚餐合照，第 2 張" data-en-alt="Lab members at a long restaurant table at the lab dinner, photo 2" width="1280" height="960" />
                <img src="../assets/activities/lab-dinner-2026-09-10-3.jpg" alt="實驗室成員在餐廳長桌旁的聚餐合照，第 3 張" data-en-alt="Lab members at a long restaurant table at the lab dinner, photo 3" width="1280" height="960" />
                <img src="../assets/activities/lab-dinner-2026-09-10-4.jpg" alt="實驗室成員在餐廳長桌旁的聚餐合照，第 4 張" data-en-alt="Lab members at a long restaurant table at the lab dinner, photo 4" width="1280" height="960" />
                <img src="../assets/activities/lab-dinner-2026-09-10-5.jpg" alt="實驗室成員在餐廳長桌旁的聚餐合照，第 5 張" data-en-alt="Lab members at a long restaurant table at the lab dinner, photo 5" width="1280" height="960" />
                <img src="../assets/activities/lab-dinner-2026-09-10-6.jpg" alt="實驗室成員在餐廳長桌旁的聚餐合照，第 6 張" data-en-alt="Lab members at a long restaurant table at the lab dinner, photo 6" width="1280" height="960" />
                <button class="slides-nav slides-prev" type="button" data-slides-prev aria-label="上一張" data-en-label="Previous photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7" /></svg></button>
                <button class="slides-nav slides-next" type="button" data-slides-next aria-label="下一張" data-en-label="Next photo"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5l7 7-7 7" /></svg></button>
              </div>
            </div>
          </dd>
